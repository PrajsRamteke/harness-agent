[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-jarvis"
dynamic = ["version"]
description = "Jarvis terminal agent"
readme = "README.md"
requires-python = ">=3.10"
# anthropic 1.x, openai 3.x and mcp 2.x moved from httpx to httpx2 (a separate
# `httpx2` module). We import httpx directly (timeouts, retry on
# httpx.ReadTimeout), so stay on the httpx-based majors until we migrate.
dependencies = [
    "anthropic>=0.40,<1",
    "openai>=1.0,<3",
    "httpx>=0.23,<1",
    "rich>=13",
    "textual>=8.2",
    "pypdf>=4.0",
    "openpyxl>=3.0",
    "mcp>=1.0.0,<2",
    "qrcode>=7.4",
]

[tool.setuptools.dynamic]
version = {attr = "jarvis.constants.models.VERSION"}

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["harness*", "jarvis*"]

[tool.setuptools.package-data]
"jarvis.web" = ["ui.html", "static/**/*"]
